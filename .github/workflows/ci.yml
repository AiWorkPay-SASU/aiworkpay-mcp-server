name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads code and uses no secret (the backend comes through its export-source action).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production dependencies have no known high or critical vulnerability
        run: npm audit --omit=dev --audit-level=high

  # Le scénario complet contre le vrai backend AIWorkPay (serveur + PostgreSQL + Stripe simulé, aucun secret ni paiement réel)
  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aw_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aw_e2e
      AUTH_SECRET: ci-placeholder-secret-min-32-chars-ok
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3300
      E2E_CONTROL_URL: http://127.0.0.1:4100
    steps:
      - uses: actions/checkout@v4
      # The private backend, obtained with this job's own GITHUB_TOKEN: no personal token, no deploy key, no SSH.
      # The runner downloads Aiworkpay-v2 at the pinned ref and the action copies it into ./backend.
      # Needs, once, on Aiworkpay-v2: Settings -> Actions -> General -> Access -> "Accessible from repositories in the
      # organization" (see the backend's docs/CI_SECRETS.md). Without it this job fails while it is being set up.
      # Pinned to the backend's default branch (GitHub accepts no expression here): update it if that branch is renamed.
      - name: Export the backend source
        uses: AiWorkPay-SASU/Aiworkpay-v2/.github/actions/export-source@claude/aiworkpay-saas-platform-cdDRB
        with:
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Start the isolated backend
        working-directory: backend
        run: |
          npm ci && npx prisma generate && npm run build
          nohup npm run e2e:harness > ../harness.log 2>&1 &
          for i in $(seq 1 90); do grep -q E2E_HARNESS_READY ../harness.log && break; sleep 2; done
          grep -q E2E_HARNESS_READY ../harness.log || { cat ../harness.log; exit 1; }
      - run: npm run test:e2e
