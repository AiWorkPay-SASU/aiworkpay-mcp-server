name: lock probe (temporary)
on:
  push:
    branches: ['tmp/lock-probe']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm audit fix --package-lock-only --ignore-scripts || true
      - run: git diff --stat
      - run: npm audit --omit=dev || true
      - run: npm audit --omit=dev --audit-level=high
      - run: sha256sum package-lock.json package.json
      - run: echo "LOCKB64_BEGIN"; gzip -9c package-lock.json | base64 -w0; echo; echo "LOCKB64_END"
