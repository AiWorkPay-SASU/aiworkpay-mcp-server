name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads code. The cross-repository read uses BACKEND_READ_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Le scénario complet contre le vrai backend AIWorkPay (serveur + PostgreSQL + Stripe simulé, aucun secret ni paiement réel)
  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aw_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aw_e2e
      AUTH_SECRET: ci-placeholder-secret-min-32-chars-ok
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3300
      E2E_CONTROL_URL: http://127.0.0.1:4100
    steps:
      - uses: actions/checkout@v4
      # Fail with a clear reason (not "Input required and not supplied: token") when the secret is not configured.
      # The value is never printed.
      - name: Require BACKEND_READ_TOKEN
        env:
          BACKEND_READ_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
        run: |
          if [ -z "$BACKEND_READ_TOKEN" ]; then
            echo "::error title=BACKEND_READ_TOKEN missing::Add a read-only token for AiWorkPay-SASU/Aiworkpay-v2 as the repository secret BACKEND_READ_TOKEN. This e2e job is NOT validated until then."
            exit 1
          fi
      # The backend that V2 ships (PR #10), not the older claude/agent-ecosystem-v1
      - uses: actions/checkout@v4
        with:
          repository: AiWorkPay-SASU/Aiworkpay-v2
          ref: integration/backend-v2
          path: backend
          token: ${{ secrets.BACKEND_READ_TOKEN }}
          persist-credentials: false # the token is not left in backend/.git/config for the following steps
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Start the isolated backend
        working-directory: backend
        run: |
          npm ci && npx prisma generate && npm run build
          nohup npm run e2e:harness > ../harness.log 2>&1 &
          for i in $(seq 1 90); do grep -q E2E_HARNESS_READY ../harness.log && break; sleep 2; done
          grep -q E2E_HARNESS_READY ../harness.log || { cat ../harness.log; exit 1; }
      - run: npm run test:e2e
